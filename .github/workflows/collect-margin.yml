name: Collect verified margin financing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-margin.yml'
      - 'scripts/*margin*.mjs'
      - 'lib/margin.ts'
  schedule:
    # Official summaries describe the prior session, including Monday release
    # of Friday's Shenzhen statistics. Off-minute retries avoid one fixed tick.
    - cron: '7,37 1 * * 1-5' # Beijing 09:07 / 09:37
    - cron: '17 2 * * 1-5'   # Beijing 10:17
    - cron: '23 4 * * 1-5'   # Beijing 12:23
    - cron: '37 8 * * 1-5'   # Beijing 16:37

permissions:
  contents: write

concurrency:
  group: market-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check units, dates, identities and historical ladders
        run: node --experimental-strip-types scripts/margin-self-check.mjs
      - name: Collect and cross-check exchange financing data
        env:
          MARGIN_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node --experimental-strip-types scripts/collect-margin.mjs
      - name: Verify history and derived figures
        run: node --experimental-strip-types scripts/verify-margin.mjs
      - name: Save verified data without rebuilding the site
        run: |
          git add public/data/margin.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update verified margin financing'
            git pull --rebase origin main
            git push
          fi
