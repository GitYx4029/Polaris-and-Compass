name: Collect verified margin financing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect-margin.yml'
      - 'scripts/*margin*.mjs'
      - 'lib/margin.ts'
  schedule:
    # Official summaries describe the prior session, including Monday release
    # of Friday's Shenzhen statistics. Off-minute retries avoid one fixed tick.
    - cron: '7,37 1 * * 1-5' # Beijing 09:07 / 09:37
    - cron: '17 2 * * 1-5'   # Beijing 10:17
    - cron: '23 4 * * 1-5'   # Beijing 12:23
    - cron: '37 8 * * 1-5'   # Beijing 16:37
    - cron: '37 9,10,12 * * 1-5' # Beijing 17:37 / 18:37 / 20:37 catch-up

permissions:
  contents: write
  id-token: write

concurrency:
  group: financing-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check units, dates, identities and historical ladders
        run: |
          node --experimental-strip-types scripts/margin-self-check.mjs
          node --experimental-strip-types --test scripts/margin-resilience.test.mjs
      - name: Collect and cross-check exchange financing data
        env:
          MARGIN_FULL: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node --experimental-strip-types scripts/run-margin-collection.mjs
      - name: Verify history and derived figures
        run: node --experimental-strip-types scripts/verify-margin.mjs
      - name: Exercise live independent backup on code changes
        if: github.event_name == 'push'
        continue-on-error: true # A temporarily unavailable backup cannot block good official data.
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import {createMarginRequest,parseEmoney} from './scripts/margin-resilience.mjs';
          import {matchVenue} from './scripts/margin-adapters.mjs';
          import {marginSources} from './lib/margin.ts';
          const s=JSON.parse(await fs.readFile('public/data/margin.json','utf8'));
          const raw=await createMarginRequest()(marginSources.backup),row=s.history.at(-1);
          for(const venue of ['sh','sz']){
            const table=parseEmoney(raw,venue);if(!table.has(s.asOf))throw Error('Backup date unavailable: '+s.asOf);
            matchVenue(row[venue],table.get(s.asOf),1e6);
          }
          console.log(JSON.stringify({liveBackupVerified:true,asOf:s.asOf,scope:'SH_SZ separately, excludes Beijing',fields:['balance','buy','short','total'],toleranceYuan:1e6}));
          JS
      - name: Save verified data without rebuilding the site
        run: node scripts/save-collected-data.mjs public/data/margin.json
      - name: Publish verified public data to Site
        run: node scripts/publish-site-data.mjs margin.json
