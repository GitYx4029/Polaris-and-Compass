name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # The collector's GITHUB_TOKEN commit does not fire push workflows.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Check parser, rolling window and refresh schedule
        run: node --experimental-strip-types scripts/self-check.mjs
      - name: Check independent scheduler decisions
        run: node scheduler/self-check.mjs
      - name: Check ETF ranking and matching transaction dates
        run: node scripts/etf-flows-self-check.mjs
      - name: Verify ETF latest and historical rankings
        run: node scripts/verify-etf-flows.mjs
      - name: Verify committed snapshot consistency
        run: node scripts/verify-market.mjs
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
