name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 04:10 / 07:25 = China 12:10 / 15:25, weekdays.
    - cron: '10 4 * * 1-5'
    - cron: '25 7 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Collect and cross-check market data
        run: node scripts/collect-market.mjs
      - name: Preserve verified history in the repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/market-snapshot.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update verified market snapshot'
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./out
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
